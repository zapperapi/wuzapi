name: Build and Test

on:
  push:
    branches: [ main, develop, update/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build Go Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'
        cache: true

    # libopus: dependência nativa da transcodificação da perna do navegador (feature 021).
    # O build usa CGO, então a CI precisa dos cabeçalhos como o Dockerfile precisa.
    - name: Install native dependencies
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus-dev

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Tidy dependencies
      run: go mod tidy

    - name: Check for uncommitted changes
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "Error: go mod tidy produced changes. Please run 'go mod tidy' locally and commit the changes."
          git diff
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    # A feature 021 depende de teste de concorrência em Go para provar SC-008 (exatamente uma
    # chamada vence a disputa pela linha) e SC-009 (exatamente um atendente conduz uma chamada
    # entrante). Sem este passo, as duas garantias só valeriam na máquina de quem lembrou de
    # rodar os testes. `-race` existe porque o que se testa aqui é justamente corrida.
    - name: Run tests
      run: go test -race ./...

    - name: Build application
      run: go build -v -o wuzapi

    - name: Upload build artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: wuzapi-binary
        path: wuzapi
        retention-days: 7
