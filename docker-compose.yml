services:
  wuzapi-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WUZAPI_PORT:-8080}:8080"
      # Mídia do softphone (feature 021). Uma porta UDP muxada para todas as sessões, e uma
      # porta TCP como rota de fuga para redes que bloqueiam UDP. Ver DEPLOY_SOFTPHONE.md.
      - "${SOFTPHONE_MEDIA_UDP_PORT:-3478}:3478/udp"
      - "${SOFTPHONE_MEDIA_TCP_PORT:-3479}:3479/tcp"
    environment:
      - WUZAPI_ADMIN_TOKEN=${WUZAPI_ADMIN_TOKEN}
      - SOFTPHONE_TOKEN_SECRET=${SOFTPHONE_TOKEN_SECRET:-}
      - SOFTPHONE_PUBLIC_IP=${SOFTPHONE_PUBLIC_IP:-127.0.0.1}
      - SOFTPHONE_MEDIA_UDP_PORT=${SOFTPHONE_MEDIA_UDP_PORT:-3478}
      - SOFTPHONE_MEDIA_TCP_PORT=${SOFTPHONE_MEDIA_TCP_PORT:-3479}
      - WUZAPI_GLOBAL_ENCRYPTION_KEY=${WUZAPI_GLOBAL_ENCRYPTION_KEY}
      - WUZAPI_GLOBAL_HMAC_KEY=${WUZAPI_GLOBAL_HMAC_KEY:-}
      - WUZAPI_GLOBAL_WEBHOOK=${WUZAPI_GLOBAL_WEBHOOK:-}
      - DB_USER=${DB_USER:-wuzapi}
      - DB_PASSWORD=${DB_PASSWORD:-wuzapi}
      - DB_NAME=${DB_NAME:-wuzapi}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - TZ=${TZ:-America/Sao_Paulo}
      - WEBHOOK_FORMAT=${WEBHOOK_FORMAT:-json}
      - SESSION_DEVICE_NAME=${SESSION_DEVICE_NAME:-WuzAPI}
      - QUEUE_SERVER_ID=${QUEUE_SERVER_ID:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wuzapi-network
    restart: on-failure

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-wuzapi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wuzapi}
      POSTGRES_DB: ${DB_NAME:-wuzapi}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - wuzapi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wuzapi}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

networks:
  wuzapi-network:
    driver: bridge

volumes:
  db_data:
